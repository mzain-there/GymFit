<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — GymFit</title>
  <meta name="description" content="Sign in or create an account to access the GymFit admin dashboard." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    .login-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0, 229, 153, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 50%, rgba(0, 212, 255, 0.06) 0%, transparent 60%);
    }

    .login-grid-lines {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 229, 153, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 153, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 20px;
    }

    .login-box {
      background: var(--bg-card);
      padding: 48px 40px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg), 0 0 60px rgba(0, 229, 153, 0.05);
      text-align: center;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .login-logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .login-logo span {
      color: var(--primary);
    }

    .login-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 32px var(--primary-glow);
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .login-box .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .login-box .form-label {
      margin-bottom: 6px;
    }

    .login-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
      background: rgba(255, 71, 87, 0.08);
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 71, 87, 0.2);
    }

    .login-footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--primary);
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Tab Switcher */
    .auth-tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: calc(var(--radius) - 4px);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .auth-tab.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 2px 12px var(--primary-glow);
    }

    .auth-tab:not(.active):hover {
      color: var(--text-primary);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
      animation: fadeSlideIn 0.3s ease;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* Existing accounts list */
    .existing-accounts {
      margin-top: 16px;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .account-item:hover {
      border-color: var(--primary);
      background: var(--bg-elevated);
      transform: translateX(4px);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .account-item-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #000;
      flex-shrink: 0;
    }

    .account-item-avatar img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .account-item-info {
      flex: 1;
      min-width: 0;
    }

    .account-item-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }

    .account-item-email {
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-item-arrow {
      color: var(--text-muted);
      font-size: 16px;
      transition: transform 0.2s;
    }

    .account-item:hover .account-item-arrow {
      color: var(--primary);
      transform: translateX(4px);
    }
  </style>
</head>

<body>
  <div class="login-bg"></div>
  <div class="login-grid-lines"></div>

  <div class="login-wrapper">
    <div class="login-box" id="loginBox">
      <div class="login-icon">🔐</div>
      <div class="login-logo">Gym<span>Fit</span></div>
      <p class="login-subtitle">Access your admin dashboard</p>

      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
        <button class="auth-tab" id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <form class="auth-form active" id="signinForm" onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label class="form-label">Gmail / Email</label>
          <input type="email" id="signinEmail" class="form-control" placeholder="yourname@gmail.com" required
            autofocus style="width:100%;" />
        </div>
        <div class="login-error" id="signinError"></div>
        <button type="submit" class="btn btn-primary btn-glow"
          style="width: 100%; justify-content: center; padding: 14px; font-size: 16px;">
          Sign In →
        </button>

        <!-- Existing Accounts Quick Access -->
        <div id="existingAccountsList" class="existing-accounts"></div>
      </form>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signupForm" onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label class="form-label">Gmail / Email *</label>
          <input type="email" id="signupEmail" class="form-control" placeholder="yourname@gmail.com" required
            style="width:100%;" />
        </div>
        <div class="form-group">
          <label class="form-label">Username *</label>
          <input type="text" id="signupUsername" class="form-control" placeholder="Choose a display name" required
            style="width:100%;" />
        </div>
        <div class="login-error" id="signupError"></div>
        <button type="submit" class="btn btn-primary btn-glow"
          style="width: 100%; justify-content: center; padding: 14px; font-size: 16px;">
          Create Account →
        </button>
      </form>

      <div class="login-divider">or</div>

      <div class="login-footer">
        <a href="index.html">← Back to Home</a>
        &nbsp;·&nbsp;
        <a href="register.html">Register as Member</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // If already logged in, redirect to dashboard
    if (localStorage.getItem('loggedIn') === 'true' && Auth.getActiveAccount()) {
      window.location.href = 'dashboard.html';
    }

    function switchTab(tab) {
      document.getElementById('tabSignIn').classList.toggle('active', tab === 'signin');
      document.getElementById('tabSignUp').classList.toggle('active', tab === 'signup');
      document.getElementById('signinForm').classList.toggle('active', tab === 'signin');
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
      
      // Clear errors
      document.getElementById('signinError').style.display = 'none';
      document.getElementById('signupError').style.display = 'none';
    }

    function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById('signinEmail').value.trim();
      const errorEl = document.getElementById('signinError');

      if (!email) {
        showError(errorEl, 'Please enter your email address.');
        return;
      }

      const result = Auth.signIn(email);
      if (result.success) {
        animateAndRedirect();
      } else {
        showError(errorEl, result.message);
        shakeBox();
      }
    }

    function handleSignUp(e) {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const errorEl = document.getElementById('signupError');

      if (!email || !username) {
        showError(errorEl, 'Please fill in all fields.');
        return;
      }

      if (username.length < 2) {
        showError(errorEl, 'Username must be at least 2 characters.');
        return;
      }

      const result = Auth.createAccount(email, username);
      if (result.success) {
        animateAndRedirect();
      } else {
        showError(errorEl, result.message);
        shakeBox();
      }
    }

    function quickSignIn(email) {
      const result = Auth.signIn(email);
      if (result.success) {
        animateAndRedirect();
      }
    }

    function showError(el, message) {
      el.textContent = '❌ ' + message;
      el.style.display = 'block';
    }

    function animateAndRedirect() {
      const box = document.getElementById('loginBox');
      box.style.transform = 'scale(0.95)';
      box.style.opacity = '0.5';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 300);
    }

    function shakeBox() {
      const box = document.getElementById('loginBox');
      box.style.animation = 'shake 0.5s ease';
      setTimeout(() => { box.style.animation = ''; }, 500);
    }

    // Render existing accounts for quick sign-in
    function renderExistingAccounts() {
      const accounts = Auth.getAccounts();
      const container = document.getElementById('existingAccountsList');
      
      if (accounts.length === 0) {
        container.innerHTML = `
          <div style="margin-top:20px;padding:16px;background:var(--bg-input);border-radius:var(--radius);border:1px solid var(--border);">
            <p style="font-size:12px;color:var(--text-muted);text-align:center;margin:0;">No accounts yet. <a href="#" onclick="switchTab('signup'); return false;" style="color:var(--primary);font-weight:600;">Create one</a> to get started.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div style="margin-top:20px;">
          <p style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:700;margin-bottom:10px;">Quick Access</p>
          ${accounts.map(acc => `
            <div class="account-item" onclick="quickSignIn('${Auth.escapeHtml(acc.email)}')">
              <div class="account-item-avatar" style="background:${acc.avatarColor};">
                ${acc.avatar 
                  ? `<img src="${acc.avatar}" alt="${Auth.escapeHtml(acc.username)}">`
                  : Auth.getInitials(acc.username)
                }
              </div>
              <div class="account-item-info">
                <div class="account-item-name">${Auth.escapeHtml(acc.username)}</div>
                <div class="account-item-email">${Auth.escapeHtml(acc.email)}</div>
              </div>
              <span class="account-item-arrow">→</span>
            </div>
          `).join('')}
        </div>`;
    }

    // Initial render
    renderExistingAccounts();
  </script>
</body>

</html>
